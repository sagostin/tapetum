# All deploy-time knobs live in .env (see .env.example) — you should not
# need to edit this file. Compose reads .env automatically for both
# interpolation below and (via env_file) the app's optional TAPETUM_* vars.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${DB_BIND:-127.0.0.1:5432}:5432" # localhost-only by default; safe to keep in prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tapetum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tapetum}
      POSTGRES_DB: ${POSTGRES_DB:-tapetum}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
      - "${PPROF_BIND:-127.0.0.1:6060}:6060" # pprof; only serves if TAPETUM_PPROF_ADDR is set
    env_file:
      - path: .env
        required: false # TAPETUM_DEV / PUBLIC_URL / SECRET_KEY / LOG_LEVEL / PPROF_ADDR
    environment:
      TAPETUM_DATABASE_URL: ${TAPETUM_DATABASE_URL:-postgres://${POSTGRES_USER:-tapetum}:${POSTGRES_PASSWORD:-tapetum}@db:5432/${POSTGRES_DB:-tapetum}?sslmode=disable}
      TAPETUM_ADDR: ":8080"
      TAPETUM_PPROF_ADDR: ${TAPETUM_PPROF_ADDR:-}
    volumes:
      - tapetum-data:/data
    depends_on:
      db:
        condition: service_healthy

  # Optional analytics tier — uncomment to enable ClickHouse (phase 4).
  # clickhouse:
  #   image: clickhouse/clickhouse-server:24-alpine
  #   restart: unless-stopped
  #   ports:
  #     - "8123:8123"
  #   volumes:
  #     - chdata:/var/lib/clickhouse

volumes:
  pgdata:
  tapetum-data:
  # chdata:
